# Two independent Compose projects; only the application publishes a loopback port.
name: cenit-${CENIT_ENV:?}
services:
  db:
    image: docker.io/library/postgres:17.11-alpine3.24@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: cenit_admin
      POSTGRES_DB: cenit_demo
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets: [postgres-password, app-password, migrator-password]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/local/init-db.sh:/docker-entrypoint-initdb.d/10-cenit.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U cenit_admin -d cenit_demo && psql -U cenit_admin -d cenit_demo -Atc \"SELECT count(*) = 2 FROM pg_roles WHERE rolname IN ('cenit_app','cenit_migrator')\" | grep -qx t"]
      interval: 5s
      timeout: 5s
      retries: 24
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
    logging: &logging
      driver: local
      options: { max-size: 10m, max-file: '3' }
  ocr:
    image: ${CENIT_OCR_IMAGE:?}
    read_only: true
    tmpfs: ["/tmp:rw,size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1
    restart: unless-stopped
    logging: *logging
  migrate:
    profiles: [migration]
    image: ${CENIT_APP_IMAGE:?}
    command: [node, /app/deploy/migrate.cjs]
    environment:
      DATABASE_URL_FILE: /run/secrets/migrator-url
    secrets: [migrator-url]
    mem_limit: 384m
    restart: 'no'
    logging: *logging
  app:
    image: ${CENIT_APP_IMAGE:?}
    environment:
      NODE_ENV: production
      APP_ENV: demo
      HOST: 0.0.0.0
      PORT: '3000'
      AUTH_COOKIE_SECURE: 'true'
      AUTH_ALLOWED_ORIGINS: ${CENIT_ORIGIN:?}
      DATABASE_URL_FILE: /run/secrets/app-url
      OCR_URL: http://ocr:8090
      CAPTURE_RECEIPT_KEY_FILE: /run/secrets/capture-receipt-key
    secrets: [app-url, capture-receipt-key]
    ports: ['127.0.0.1:${CENIT_HTTP_PORT:?}:3000']
    depends_on:
      db: { condition: service_healthy }
      ocr: { condition: service_healthy }
    mem_limit: 384m
    cpus: 0.75
    restart: unless-stopped
    logging: *logging
volumes:
  postgres-data: {}
secrets:
  postgres-password: { file: ./.local/secrets/postgres-password }
  app-password: { file: ./.local/secrets/app-password }
  migrator-password: { file: ./.local/secrets/migrator-password }
  app-url: { file: ./.local/secrets/app-url }
  migrator-url: { file: ./.local/secrets/migrator-url }
  capture-receipt-key: { file: ./.local/secrets/capture-receipt-key }
