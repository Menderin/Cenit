# Load as /etc/nginx/conf.d/default.conf inside cenit-nginx.
# Both cenit-nginx and cenit-app must join the cenit-net Podman network.
# Start cenit-app before validating or starting this proxy.
server {
    listen 8080;
    server_name _;

    client_max_body_size 128k;
    error_page 413 = @payload_too_large;

    location @payload_too_large {
        default_type application/json;
        add_header X-Request-Id $request_id always;
        return 413 '{"error":{"code":"PAYLOAD_TOO_LARGE","message":"La solicitud supera el límite de 128 KiB.","requestId":"$request_id"}}';
    }

    location / {
        proxy_pass http://cenit-app:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
