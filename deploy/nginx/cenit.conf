# Load as /etc/nginx/conf.d/default.conf inside cenit-nginx.
# Both cenit-nginx and cenit-app must join the cenit-net Podman network.
# Start cenit-app before validating or starting this proxy.
server {
    listen 8080;
    server_name _;

    client_max_body_size 128k;
    error_page 413 = @payload_too_large;
    # Server rewrite runs before location/body-size selection. Preserve the POST
    # method/body and select the larger limit only for the canonical create route.
    if ($request_method = POST) {
        rewrite ^/api/v1/purchases$ /__cenit_purchase_create last;
    }

    location @payload_too_large {
        default_type application/json;
        add_header X-Request-Id $request_id always;
        return 413 '{"error":{"code":"PAYLOAD_TOO_LARGE","message":"La solicitud supera el tamaño permitido.","requestId":"$request_id"}}';
    }

    location = /__cenit_purchase_create {
        internal;
        client_max_body_size 512k;
        proxy_pass http://cenit-app:3000/api/v1/purchases;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /api/v1/purchases/extractions {
        client_max_body_size 6m;
        proxy_pass http://cenit-app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
    }

    location / {
        proxy_pass http://cenit-app:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
