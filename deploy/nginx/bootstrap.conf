# Cenit infrastructure bootstrap. Do not confuse proxy health with app readiness.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;
    add_header Cache-Control "no-store" always;

    location = /health/proxy {
        default_type application/json;
        return 200 '{"status":"ok","mode":"bootstrap"}';
    }

    location = /health/ready {
        default_type application/json;
        return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"Cenit aún no está desplegado.","requestId":"$request_id"}}';
    }

    location /api {
        default_type application/json;
        return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"Cenit aún no está desplegado.","requestId":"$request_id"}}';
    }

    location / {
        try_files $uri /index.html;
    }
}
