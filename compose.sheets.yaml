# Explicit opt-in; use a dedicated test spreadsheet before any institutional data.
services:
  app:
    environment:
      CENIT_PURCHASE_SHEETS_SYNC_ENABLED: 'true'
      CENIT_PURCHASE_SHEETS_ID: ${CENIT_PURCHASE_SHEETS_ID:?Set a dedicated spreadsheet ID}
      CENIT_PURCHASE_SHEETS_KEY_FILE: /run/secrets/purchase-sheets-key
    secrets: [purchase-sheets-key]
secrets:
  purchase-sheets-key:
    file: ./.local/secrets/purchase-sheets-key.json
