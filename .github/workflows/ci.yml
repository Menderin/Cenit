name: Cenit CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main, 'feat/**', 'fix/**', 'test/**', 'docs/**', 'codex/**']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prerequisites:
    name: Prerequisites
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      app_ready: ${{ steps.check.outputs.app_ready }}
      academic_ready: ${{ steps.check.outputs.academic_ready }}
      web_ready: ${{ steps.check.outputs.web_ready }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check application CI contract
        id: check
        env:
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: python3 deploy/scripts/check-ci-readiness.py

  infrastructure:
    name: Infrastructure
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check shell syntax
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find deploy -name '*.sh' -print0)
      - name: Compile Python utilities
        run: python3 -m compileall -q deploy/scripts
      - name: Test application CI gate
        run: python3 -m unittest discover -s tests/infrastructure -v
      - name: Validate local Compose configuration
        run: |
          python3 deploy/scripts/setup-local.py
          docker compose --profile application config --quiet
      - name: Validate bootstrap Nginx
        run: |
          docker run --rm --network none \
            -v "$PWD/deploy/nginx/bootstrap.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/deploy/bootstrap:/usr/share/nginx/html:ro" \
            docker.io/library/nginx:1.30.5-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94 nginx -t
      - name: Start local infrastructure and verify limited roles
        run: |
          set -euo pipefail
          docker compose up --detach --wait --wait-timeout 120 db proxy
          curl --fail --silent http://127.0.0.1:8081/health/proxy \
            | python3 -c 'import json,sys; assert json.load(sys.stdin) == {"status":"ok","mode":"bootstrap"}'
          result=$(docker compose exec -T db psql -U cenit_admin -d cenit_demo -Atc \
            "SELECT count(*) FROM pg_roles WHERE rolname IN ('cenit_app','cenit_migrator') AND NOT rolsuper AND NOT rolcreatedb AND NOT rolcreaterole")
          [[ "$result" == 2 ]]
          result=$(docker compose exec -T db psql -U cenit_admin -d cenit_demo -Atc \
            "SELECT has_schema_privilege('cenit_app','cenit','USAGE') AND NOT has_schema_privilege('cenit_app','cenit','CREATE')")
          [[ "$result" == t ]]
      - name: Stop CI infrastructure
        if: always()
        run: docker compose down

  academic:
    name: Academic foundation
    needs: prerequisites
    if: needs.prerequisites.outputs.academic_ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.11-alpine3.24@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: cenit_test
          POSTGRES_PASSWORD: ci-only-not-a-deployment-secret
          POSTGRES_DB: cenit_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cenit_test -d cenit_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CI: 'true'
      DATABASE_URL: postgres://cenit_test:ci-only-not-a-deployment-secret@127.0.0.1:5432/cenit_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.node-version'
      - name: Install pinned npm
        run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm run catalog:check
      - run: npm run test:unit
      - run: npm run build
      - run: npm run test:integration
      - name: Install browser for authentication checks
        if: needs.prerequisites.outputs.web_ready == 'true'
        run: npm exec --no -- playwright install --with-deps chromium
      - name: Test real browser authentication
        if: needs.prerequisites.outputs.web_ready == 'true'
        run: npm run test:e2e:auth
      - name: Test academic catalog in the browser
        if: needs.prerequisites.outputs.web_ready == 'true'
        run: npm run test:e2e:academic
      - name: Test compiled monolith without Vite
        run: npm run test:e2e:production
      - name: Build and verify local candidate image
        run: |
          docker build --platform linux/amd64 --file Containerfile --build-arg "VCS_REF=$GITHUB_SHA" --tag cenit-candidate:verified .
          python3 deploy/scripts/verify-image.py --image cenit-candidate:verified --revision "$GITHUB_SHA"

  application:
    name: Application
    needs: prerequisites
    if: needs.prerequisites.outputs.app_ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.11-alpine3.24@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: cenit_test
          POSTGRES_PASSWORD: ci-only-not-a-deployment-secret
          POSTGRES_DB: cenit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cenit_test -d cenit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: 'true'
      DATABASE_URL: postgres://cenit_test:ci-only-not-a-deployment-secret@127.0.0.1:5432/cenit_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.node-version'
      - name: Install pinned npm
        run: |
          npm_version=$(node -p "require('./package.json').packageManager.slice(4)")
          npm install --global "npm@$npm_version"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run catalog:check
      - run: npm run test:unit
      - run: npm run build
      - run: npm run test:integration
      - name: Install Playwright browser
        run: npm exec --no -- playwright install --with-deps chromium
      - name: Test OCR image validation and candidate mapping
        # No weights or inference; real OCR is measured separately on the notebook.
        run: |
          python3 -m venv "$RUNNER_TEMP/cenit-ocr-tests"
          "$RUNNER_TEMP/cenit-ocr-tests/bin/pip" install --disable-pip-version-check -r apps/ocr/requirements.lock
          PYTHONPATH=apps/ocr "$RUNNER_TEMP/cenit-ocr-tests/bin/python" -m unittest discover -s tests/ocr -v
      - run: npm run test:e2e
      - name: Build and verify delivery image
        run: |
          docker build --platform linux/amd64 --file Containerfile --build-arg "VCS_REF=$GITHUB_SHA" --tag cenit-candidate:verified .
          python3 deploy/scripts/verify-image.py --image cenit-candidate:verified --revision "$GITHUB_SHA"

  required:
    name: CI required
    if: always()
    needs: [prerequisites, infrastructure, academic, application]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all applicable checks
        env:
          PREREQUISITES: ${{ needs.prerequisites.result }}
          INFRASTRUCTURE: ${{ needs.infrastructure.result }}
          APPLICATION: ${{ needs.application.result }}
          APP_READY: ${{ needs.prerequisites.outputs.app_ready }}
          ACADEMIC_READY: ${{ needs.prerequisites.outputs.academic_ready }}
          ACADEMIC: ${{ needs.academic.result }}
        run: |
          set -euo pipefail
          [[ "$PREREQUISITES" == success ]]
          [[ "$INFRASTRUCTURE" == success ]]
          if [[ "$ACADEMIC_READY" == true ]]; then
            [[ "$ACADEMIC" == success ]]
          else
            [[ "$ACADEMIC" == skipped ]]
          fi
          if [[ "$APP_READY" == true ]]; then
            [[ "$APPLICATION" == success ]]
          else
            [[ "$APPLICATION" == skipped ]]
            echo 'Infrastructure checked; application is not initialized. No release is authorized.'
          fi
