name: Cenit CI

on:
  pull_request:
    branches: [main, produccion]
  push:
    branches: [main, produccion]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prerequisites:
    name: Prerequisites
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      app_ready: ${{ steps.check.outputs.app_ready }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check application CI contract
        id: check
        env:
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: python3 deploy/scripts/check-ci-readiness.py

  infrastructure:
    name: Infrastructure
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check shell syntax
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find deploy/scripts -name '*.sh' -print0)
      - name: Compile Python utilities
        run: python3 -m compileall -q deploy/scripts
      - name: Test application CI gate
        run: python3 -m unittest discover -s tests/infrastructure -v
      - name: Validate bootstrap Nginx
        run: |
          docker run --rm --network none \
            -v "$PWD/deploy/nginx/bootstrap.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/deploy/bootstrap:/usr/share/nginx/html:ro" \
            docker.io/library/nginx:1.30.5-alpine nginx -t

  application:
    name: Application
    needs: prerequisites
    if: needs.prerequisites.outputs.app_ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.11-alpine3.24
        env:
          POSTGRES_USER: cenit_test
          POSTGRES_PASSWORD: ci-only-not-a-deployment-secret
          POSTGRES_DB: cenit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cenit_test -d cenit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: 'true'
      DATABASE_URL: postgres://cenit_test:ci-only-not-a-deployment-secret@127.0.0.1:5432/cenit_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install pinned npm
        run: |
          npm_version=$(node -p "require('./package.json').packageManager.slice(4)")
          npm install --global "npm@$npm_version"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build
      - name: Install Playwright browser
        run: npm exec --no -- playwright install --with-deps chromium
      - run: npm run test:e2e

  required:
    name: CI required
    if: always()
    needs: [prerequisites, infrastructure, application]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all applicable checks
        env:
          PREREQUISITES: ${{ needs.prerequisites.result }}
          INFRASTRUCTURE: ${{ needs.infrastructure.result }}
          APPLICATION: ${{ needs.application.result }}
          APP_READY: ${{ needs.prerequisites.outputs.app_ready }}
        run: |
          set -euo pipefail
          [[ "$PREREQUISITES" == success ]]
          [[ "$INFRASTRUCTURE" == success ]]
          if [[ "$APP_READY" == true ]]; then
            [[ "$APPLICATION" == success ]]
          else
            [[ "$APPLICATION" == skipped ]]
            echo 'Infrastructure checked; application is not initialized. No release is authorized.'
          fi
