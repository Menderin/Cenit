name: ${COMPOSE_PROJECT_NAME:-cenit-local}

services:
  ocr:
    profiles: [ocr]
    image: localhost/cenit-ocr:adapter1
    build:
      context: ./apps/ocr
      dockerfile: Containerfile
    ports: ["127.0.0.1:8090:8090"]
    networks: [cenit]
    read_only: true
    tmpfs: ["/tmp:rw,size=64m,mode=1777"]
    # Health probe recovered from ihelo's SCRUM-133, commit 35f336a.
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 1g
    cpus: 1
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"

  db:
    image: docker.io/library/postgres:17.11-alpine3.24@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: cenit_admin
      POSTGRES_DB: cenit_demo
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets:
      - postgres-password
      - app-password
      - migrator-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/local/init-db.sh:/docker-entrypoint-initdb.d/10-cenit.sh:ro
    ports:
      - "127.0.0.1:${CENIT_DB_PORT:-55432}:5432"
    networks: [cenit]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U cenit_admin -d cenit_demo >/dev/null &&
          psql -U cenit_admin -d cenit_demo -Atc
          "SELECT count(*) = 2 FROM pg_roles WHERE rolname IN ('cenit_app','cenit_migrator')"
          | grep -qx t
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 512m
    restart: unless-stopped

  proxy:
    image: docker.io/library/nginx:1.30.5-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    entrypoint: [nginx]
    command: [-g, "daemon off;"]
    user: "101:101"
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,size=64m,mode=1777
      - /var/run:rw,size=1m,mode=1777
    volumes:
      - ${CENIT_NGINX_CONFIG:-./deploy/nginx/bootstrap.conf}:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/bootstrap:/usr/share/nginx/html:ro
    ports:
      - "127.0.0.1:${CENIT_HTTP_PORT:-8081}:8080"
    networks: [cenit]
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 128m
    restart: unless-stopped

  migrate:
    profiles: [application]
    image: localhost/cenit-local:dev
    build:
      context: .
      dockerfile: Containerfile
    command: [node, /app/deploy/migrate.cjs]
    environment:
      DATABASE_URL_FILE: /run/secrets/migrator-url
    secrets: [migrator-url]
    networks: [cenit]
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 512m
    restart: "no"

  app:
    profiles: [application]
    image: localhost/cenit-local:dev
    build:
      context: .
      dockerfile: Containerfile
    environment:
      NODE_ENV: production
      APP_ENV: demo
      HOST: 0.0.0.0
      PORT: "3000"
      AUTH_COOKIE_SECURE: "false"
      AUTH_ALLOWED_ORIGINS: "http://127.0.0.1:${CENIT_HTTP_PORT:-8081},http://localhost:${CENIT_HTTP_PORT:-8081}"
      AUTH_GOOGLE_ENABLED: ${AUTH_GOOGLE_ENABLED:-false}
      AUTH_GOOGLE_CLIENT_ID: ${AUTH_GOOGLE_CLIENT_ID:-}
      DATABASE_URL_FILE: /run/secrets/app-url
    secrets: [app-url]
    networks:
      cenit:
        aliases: [cenit-app]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    mem_limit: 512m
    restart: unless-stopped

networks:
  cenit: {}
volumes:
  postgres-data: {}
secrets:
  postgres-password:
    file: ./.local/secrets/postgres-password
  app-password:
    file: ./.local/secrets/app-password
  migrator-password:
    file: ./.local/secrets/migrator-password
  app-url:
    file: ./.local/secrets/app-url
  migrator-url:
    file: ./.local/secrets/migrator-url
