<text x="8.0" y="868.07" font-size="10.6667" font-weight="bold" xml:space="preserve">NOTA :  Los días administrativos no se podrán otorgar antes ni a continuación de feriados, como tampoco en el período comprendido</text>
<text x="8.0" y="880.33" font-size="10.6667" font-weight="bold" xml:space="preserve">entre Navidad y Año Nuevo.</text>
<text x="8.0" y="892.6" font-size="10.6667" font-weight="bold" xml:space="preserve">INSTRUCCIONES:</text>
<text x="8.0" y="904.87" font-size="10.6667" font-weight="bold" xml:space="preserve">1. Para solicitar días administrativos, estos deben hacerse con 48 horas de anticipación, con todos los V°B° correspondientes.</text>
<text x="8.0" y="917.13" font-size="10.6667" font-weight="bold" xml:space="preserve">2. El permiso deberá ser justificado en el rubro OBSERVACIONES o acreditado con los certificados correspondientes según sea el caso. </text>
<text x="8.0" y="929.4" font-size="10.6667" font-weight="bold" xml:space="preserve">3. El permiso por hora debe ser recuperado en la fecha indicada, cualquier cambio debe ser informado a la Dirección de RR HH.</text>
<text x="8.0" y="941.67" font-size="10.6667" font-weight="bold" xml:space="preserve">4. Las salvedades especiales por las Negocaciones Colectivas son de conocimiento general  para cada Sindicato en particular.</text>
<text x="8.0" y="953.93" font-size="10.6667" font-weight="bold" xml:space="preserve">5. Respecto del Feriado Legal, ejemplos:</text>
<text x="8.0" y="966.2" font-size="10.6667" font-weight="bold" xml:space="preserve">Si el funcionario se toma los días según Comunicado de Rectoría, el día de inicio es el 28/01/13 y el término el 24/02/12.</text>
<text x="8.0" y="978.47" font-size="10.6667" font-weight="bold" xml:space="preserve">Receso completo de 28 días corridos (= 20 días Hábiles), el día de inicio es el 28/01/13 y el término el 22/02/13.</text>
<text x="8.0" y="990.73" font-size="10.6667" font-weight="bold" xml:space="preserve">Receso completo de 25 días hábiles, el día de inicio es el 21/01/13 y el término el 22/02/13.</text>
<text x="8.0" y="1003.0" font-size="10.6667" font-weight="bold" xml:space="preserve">Receso completo de 42 días corridos (= 30 días hábiles), el día de inicio es el 14/01/13 y el término el 22/02/13.</text>
<text x="8.0" y="1015.27" font-size="10.6667" font-weight="bold" xml:space="preserve"></text>
